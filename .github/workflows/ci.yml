name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install taplo
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: taplo-cli

      - name: Lint Cargo.toml
        run: taplo lint Cargo.toml crates/*/Cargo.toml

      - name: Check Cargo.toml formatting
        run: taplo fmt --check --option reorder_keys=true Cargo.toml crates/*/Cargo.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run cargo check
        run: cargo check --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check without default features
        run: cargo check --workspace --no-default-features

      - name: Test without default features
        run: cargo test --workspace --no-default-features
